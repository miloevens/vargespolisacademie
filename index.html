  v_migratie:{type:'mc', label:'Waarom migreerden de Grieken?', page:'Les 2, p. 17', q:'Waarom willen veel Grieken vertrekken?', opts:['De Perzen verjagen hen.','Door bevolkingsgroei, te weinig vruchtbare grond en sociale spanningen.','De zee droogt op.','Ze willen op reis voor hun plezier.'], ok:1, hint:'Kijk naar wat je net zag op het plein: meer mensen, evenveel grond, en ruzie.', uitleg:'Vanaf de 9de eeuw v.C. groeide de bevolking. Vruchtbare grond was schaars en in de poleis groeiden de sociale spanningen. Historici discussiëren nog over de precieze oorzaken.'},

  /* Deel 3: zee en kolonie */
  z_waar:{type:'mc', label:'Waar migreerden de Grieken naartoe?', page:'Les 2, p. 17-18', q:'Naar welke gebieden trokken de Griekse migranten vanaf de 8ste eeuw v.C.?', opts:['naar het binnenland van Afrika','naar de kusten van de Middellandse Zee en de Zwarte Zee','naar de Noordzee en onze streken','naar Amerika'], ok:1, hint:'Je hebt het net zelf gedaan: van kaap tot kaap, langs de kust.', uitleg:'Vanaf de 8ste eeuw v.C. stichtten Griekse migranten nederzettingen op geschikte plaatsen langs de kusten van de Middellandse Zee en de Zwarte Zee.'},
  k_kolonie:{type:'mc', label:'Een kolonie', page:'Les 2, p. 18-19', q:'Wat is een <b>kolonie</b>?', opts:['een Griekse munt','een tempel voor Poseidon','een nederzetting in een ander gebied, een dochterpolis','een kudde geiten'], ok:2, hint:'Ione gaf je net een ander woord ervoor.', uitleg:'Een kolonie is een nederzetting in een ander gebied: een dochterpolis. Het oprichten ervan noemen we kolonisatie.'},
  k_beroep:{type:'mc', label:'Beroepsspecialisatie', page:'Les 2, p. 18-19', q:'Lykos produceert geen voedsel meer. Hij legt zich toe op één beroep. Hoe noem je dat?', opts:['migratie','kolonisatie','polytheïsme','beroepsspecialisatie'], ok:3, hint:'Hij specialiseert zich in één beroep.', uitleg:'Samen met de migratie nam de beroepsspecialisatie toe: sommige mensen werkten niet meer op het land maar legden zich toe op een ambacht.'},
  k_afzet:{type:'mc', label:'Afzetmarkten en grondstoffen', page:'Les 2, p. 18-19', q:'Waarom brengen ambachtslui zoals Lykos hun producten overzee?', opts:['Ze zoeken nieuwe afzetmarkten en kopen grondstoffen zoals metaal en constructiehout.','Ze willen stoppen met werken.','Ze geven alles gratis aan de goden.','Ze mogen niet verkopen in hun eigen polis.'], ok:0, hint:'Hij heeft te veel vazen en te weinig grondstoffen.', uitleg:'Ambachtslui hadden grondstoffen nodig (metaal, constructiehout) en zochten nieuwe afzetmarkten voor hun producten. Zo groeide de handel.'},
  k_munt:{type:'mc', src:'munt', label:'Bron: munt uit Athene, primair of secundair', page:'Herhaling 1, p. 6', q:'Deze munt komt uit Athene, 5de eeuw v.C. Waarom is ze een <b>primaire</b> bron?', opts:['Omdat er tekst op staat.','Omdat ze dateert uit de tijd zelf van wat we onderzoeken.','Omdat ze later is nagemaakt.','Omdat ze van zilver is.'], ok:1, hint:'Primair of secundair gaat over het moment waarop de bron gemaakt werd.', uitleg:'Een primaire bron dateert uit de tijd zelf. Deze munt werd in de 5de eeuw v.C. geslagen. Het is ook een materiële bron.'},
  k_geld:{type:'mc', label:'Geldeconomie', page:'Les 2, p. 18-19', q:'Wat verandert er als de Grieken met <b>munten</b> gaan betalen in plaats van te ruilen?', opts:['Niemand handelt nog.','Iedereen wordt even rijk.','Ruilen wordt verplicht.','De geldeconomie maakt handel eenvoudiger.'], ok:3, hint:'Probeer eens een amfora te ruilen tegen een half schip hout...', uitleg:'De geldeconomie vereenvoudigde de handel. Samen met de langeafstandshandel ontstond zo een open landbouwsamenleving.'},
  k_symbool:{type:'mc', label:'Symbolen van identiteit', page:'Les 2, p. 19', q:'Op hun munten tonen de Atheners hun identiteit met een symbool: de uil. Ook wij doen dat vandaag. Welk symbool hoort bij de <b>Vlaamse Gemeenschap</b>?', opts:[FLAG.vlaams + ' zwarte leeuw op geel', FLAG.europa + ' twaalf gele sterren op blauw', FLAG.belgie + ' zwart, geel en rood', 'een uil op een zilveren munt'], ok:0, hint:'Denk aan de vlag met een dier op.', uitleg:'De zwarte leeuw op een gele achtergrond is het symbool van de Vlaamse Gemeenschap. De driekleur hoort bij België, de twaalf gele sterren bij Europa.'},
  k_open:{type:'sort', label:'Evolutie naar een open landbouwsamenleving', page:'Les 2, p. 19 (schema)', q:'Zet de evolutie in de juiste volgorde: van oorzaak (boven) naar gevolg (onder).', items:['bevolkingsgroei en sociale spanningen','migratie en kolonisatie','meer handel en beroepsspecialisatie','een open landbouwsamenleving'], hint:'Bekijk het schema "evolutie naar een open landbouwsamenleving" in je leerwerkboek.', uitleg:'Bevolkingsgroei en sociale spanningen leidden tot migratie. Daardoor kwamen er meer handel en beroepsspecialisatie, en zo ontstond een open landbouwsamenleving.'},
  k_limburg:{type:'mc', v:true, label:'V+ Migratie in Limburg', page:'Herhaling 2, p. 7-8 en Les 2, p. 17-19', q:'Na de Tweede Wereldoorlog kwamen veel Italiaanse arbeiders werken in de Limburgse steenkoolmijnen, onder meer in Genk en Beringen. In welk <b>tijdvak</b> gebeurde dat?', opts:['klassieke oudheid','middeleeuwen','moderne tijd','hedendaagse tijd'], ok:3, hint:'De Tweede Wereldoorlog eindigde in 1945. Welk tijdvak start dan?', uitleg:'De hedendaagse tijd start omstreeks 1945. Net zoals de Grieken zochten de Italiaanse mijnwerkers werk en een beter leven, en ze brachten hun cultuur mee.'},

  /* Deel 4: Hellas */
  h_taal:{type:'mc', label:'De rol van de gemeenschappelijke taal', page:'Les 3 deel 1, p. 20', q:'Een Athener, een Spartaan en iemand uit een verre kolonie praten zonder problemen met elkaar. Waarom was die <b>gemeenschappelijke taal</b> zo belangrijk?', opts:['Iedereen moest daardoor dezelfde koning hebben.','Ze maakte communicatie tussen de poleis makkelijk en zorgde voor een samenhorigheidsgevoel.','Zo konden de Grieken de Perzen verstaan.','Het was verplicht door een wet van Athene.'], ok:1, hint:'Wat voel je als je ver van huis iemand hoort die jouw taal spreekt?', uitleg:'Door de gemeenschappelijke taal verliep de communicatie vlot en voelden de Grieken zich verbonden, ook al waren ze politiek gescheiden.'},
  h_waarden:{type:'mc', label:'Waarden in de Ilias', page:'Les 3 deel 1, p. 21-22', q:'Welke <b>waarden</b> leren de luisteraars uit de verhalen van Homeros?', opts:['vrede, gelijkheid en democratie','luiheid en bedrog','moed, dapperheid, trouw aan de koning en gehoorzaamheid aan de goden','zuinigheid en eerlijkheid in de handel'], ok:2, hint:'Wat doen de helden in het verhaal steeds opnieuw?', uitleg:'De werken van Homeros verspreidden Griekse waarden zoals moed, dapperheid, trouw aan de koning en gehoorzaamheid aan de goden. Zo versterkte de cultuur het samenhorigheidsgevoel.'},
  h_ilias:{type:'mc', label:'Is de Ilias geschiedenis?', page:'Les 3 deel 1, p. 21-22', q:'Is de Ilias eigenlijk <b>geschiedenis</b>?', opts:['Ja, alles is echt gebeurd, want het is heel oud.','Ja, want Homeros was er zelf bij.','Nee, want het is in het Grieks.','Nee. Het is literatuur die met veel fantasie over een vaag verleden vertelt. Je kan het niet zomaar als betrouwbare bron gebruiken.'], ok:3, hint:'Goden die meevechten... is dat betrouwbare informatie?', uitleg:'De Ilias is literatuur met veel fantasie over een vaag verleden. Een historicus onderzoekt zo een bron kritisch en vergelijkt met bijvoorbeeld archeologische bronnen.'},
  h_halfgod:{type:'mc', label:'Goden, halfgoden en helden', page:'Les 3 deel 1, p. 20-22 (begrippen)', q:'Herakles is de zoon van Zeus en een gewone vrouw. Hij heeft bovennatuurlijke kracht, maar is niet onsterfelijk. Herakles is een...', opts:['god','halfgod','gewone held','priester'], ok:1, hint:'Eén ouder is een god, de andere een mens.', uitleg:'Halfgoden zijn kinderen van een god en een mens, met bijzondere krachten maar niet onsterfelijk. Helden zoals Theseus zijn gewone mensen die beroemd werden door hun moed.'},
  h_mythe:{type:'mc', label:'De rol van mythes', page:'Les 3 deel 1, p. 20', q:'Waarom vertelden de Atheners zo graag de mythe van Theseus?', opts:['als propaganda: ze toont de dapperheid van Athene en is een voorbeeld voor de opvoeding van jongeren','omdat het een betrouwbaar verslag is van een echte gebeurtenis','om de Minotaurus te eren','om toeristen te lokken'], ok:0, hint:'Wie is de held en uit welke polis komt hij?', uitleg:'Mythes dienden vaak als propaganda voor de polis. Theseus bewijst de dapperheid van Athene en is een voorbeeld voor de opvoeding van jongeren.'},
  h_theater:{type:'mc', label:'De rol van het theater', page:'Les 3 deel 1, p. 20-22', q:'Eerst hoorde vooral de elite deze verhalen op feestmalen. Wat veranderde het <b>theater</b>?', opts:['Het verbood mythes.','Het was enkel voor koningen.','Het maakte de verhalen en waarden bekend bij een breder publiek.','Het verving de tempels.'], ok:2, hint:'Kijk hoeveel mensen hier zitten.', uitleg:'Onder meer de toneelstukken in theaters zorgden ervoor dat de verhalen en waarden ook bij een breder publiek bekend werden.'},
  h_epi:{type:'mc', label:'Epidauros', page:'Les 3 deel 3, p. 24', q:'Wat is <b>Epidauros</b>?', opts:['een orakel','de plaats van de Olympische Spelen','een heiligdom met een geneesoord en een theater','een kolonie aan de Zwarte Zee'], ok:2, hint:'Waarom kwamen al die zieke mensen hierheen?', uitleg:'Epidauros was een heiligdom van Asklepios, de god van de geneeskunde, met een geneesoord en een groot theater.'},
  h_bron:{type:'mc', src:'theater', label:'Bron: het theater van Epidauros', page:'Herhaling 1, p. 6', q:'Zo ziet het theater van Epidauros er vandaag uit. Het staat er al meer dan 2300 jaar. Is dit gebouw een primaire of een secundaire bron?', opts:['secundair, want de foto is van vandaag','primair, want het gebouw werd gemaakt in de oudheid zelf','secundair, want het is een ruïne','het is geen bron'], ok:1, hint:'Kijk naar het gebouw zelf, niet naar de foto ervan.', uitleg:'Het theater werd op het einde van de 4de eeuw v.C. gebouwd: een primaire bron. Een foto van vandaag helpt ons die bron te bekijken.'},
  h_poly:{type:'mc', label:'Polytheïsme', page:'Les 3 deel 2, p. 23', q:'De Grieken geloven in <b>veel goden</b>. Hoe noemen we dat?', opts:['monotheïsme','polytheïsme','filosofie','panhellenisme'], ok:1, hint:'"Poly" betekent veel.', uitleg:'Polytheïsme of veelgodendom: geloven in meerdere goden. De Grieken stelden hun goden voor als mensen, maar onsterfelijk en met goddelijke krachten.'},
  h_offer:{type:'mc', label:'Offers en rituelen', page:'Les 3 deel 2, p. 23-24', q:'Waarom brengen de Grieken <b>offers</b> en voeren ze rituelen uit?', opts:['om belastingen te betalen','omdat de goden anders verhongeren','om de goden gunstig te stemmen','om de tempel te verkopen'], ok:2, hint:'Ze willen iets van de goden: een goede oogst, een veilige reis...', uitleg:'Met offers en rituelen (dans, zang) probeerden de Grieken de goden gunstig te stemmen. Dat deden ze in de gemeenschap, thuis met de familie en individueel.'},
  h_orakel:{type:'mc', label:'Het orakel van Delphi', page:'Les 3 deel 3, p. 24', q:'Wat is een <b>orakel</b>?', opts:['een goddelijke voorspelling','een sportwedstrijd','een geneesoord','een standbeeld van Zeus'], ok:0, hint:'Je stelde net een vraag over de toekomst.', uitleg:'Een orakel is een goddelijke voorspelling. Het bekendste orakel was dat van Delphi, het heiligdom van Apollo.'},
  h_zeus:{type:'mc', label:'De Olympische Spelen', page:'Les 3 deel 3, p. 24', q:'Ter ere van welke god werden de Olympische Spelen gehouden?', opts:['Poseidon','Athena','Zeus, de oppergod','Apollo'], ok:2, hint:'De oppergod, die met de bliksems.', uitleg:'De oude Olympische Spelen waren sportwedstrijden in Olympia ter ere van de oppergod Zeus.'},
  h_filo:{type:'mc', label:'Natuurfilosofen', page:'Les 3 deel 3, p. 25', q:'Wat deden <b>natuurfilosofen</b> zoals Thales?', opts:['Ze bouwden tempels voor Zeus.','Ze zochten verklaringen door na te denken en de natuur te observeren. Zo legden ze de basis voor de wetenschap.','Ze voorspelden de toekomst in Delphi.','Ze schreven de Ilias.'], ok:1, hint:'Thales zei het zelf: kijken en nadenken.', uitleg:'Natuurfilosofen twijfelden aan de rol van de goden en zochten andere verklaringen, door na te denken en de natuur te observeren. Zo legde de filosofie de basis voor de wetenschap.'},
  h_christ:{type:'mc', v:true, label:'V+ Griekse godsdienst en christendom', page:'Les 3 deel 2 en 3, p. 23-25', q:'Vergelijk de oude Griekse godsdienst met het christendom vandaag. Wat is een groot <b>verschil</b>?', opts:['Christenen offeren nog dieren op een altaar.','Christenen geloven in één God (monotheïsme), de Grieken in veel goden (polytheïsme).','De Grieken hadden geen heilige plaatsen.','Er is geen enkel verschil.'], ok:1, hint:'Tel het aantal goden.', uitleg:'Het christendom is monotheïstisch, de Griekse godsdienst polytheïstisch. Een gelijkenis: allebei kennen ze heilige plaatsen en rituelen.'},
  h_panhel:{type:'mc', label:'Panhellenisme', page:'Les 3 deel 3, p. 24', q:'In Delphi, Olympia en Epidauros kwamen Grieken uit <b>alle</b> poleis samen. Wat versterkte dat?', opts:['de rivaliteit tussen de poleis','de gesloten landbouwsamenleving','het panhellenisme: het samenhorigheidsgevoel door een gemeenschappelijke cultuur','de macht van één koning'], ok:2, hint:'"Pan" betekent alle, "Hellenen" zijn de Grieken.', uitleg:'Panhellenisme is het samenhorigheidsgevoel van de Grieken door hun gemeenschappelijke cultuur: taal, godsdienst, kunst. De Olympische Spelen zijn het bekendste panhelleense evenement.'},

  /* Deel 5: Akropolis */
  a_eeuw:{type:'mc', label:'447 v.C. in de juiste eeuw', page:'Herhaling 2, p. 7-8', q:'De bouw van het Parthenon start in <b>447 v.C.</b> In welke eeuw is dat?', opts:['de 4de eeuw v.C.','de 45ste eeuw v.C.','de 5de eeuw v.C.','de 5de eeuw n.C.'], ok:2, hint:'De jaren 500 tot 401 v.C. vormen één eeuw.', uitleg:'447 v.C. ligt tussen 500 en 401 v.C.: de 5de eeuw v.C.'},
  a_dom:{type:'cat', label:'De tempelbouw en de domeinen', page:'Les 3 deel 4, p. 26 en Herhaling 3', q:'Om zo een tempel te bouwen moet de hele polis samenwerken. Bij welk <b>domein</b> hoort elke taak het best?', bins:DOMB, items:[['de burgers maken afspraken over de bouw en het geld','P'],['burgers en slaven werken samen als werklieden','S'],['marmer uit de groeve kopen en vervoeren','E'],['beelden van goden en mythes in de gevel hakken','C']], hint:'Afspraken = besturen. Samenwerken = samenleven. Kopen en vervoeren = overleven. Kunst en godsdienst = creatief.', uitleg:'Afspraken: politiek. Samenwerking: sociaal. Kopen en vervoeren: economisch. Goden en mythes in beeld: cultureel.'},
  a_kleur:{type:'mc', label:'De kleuren van de tempels', page:'Les 3 deel 4, p. 26', q:'Vandaag zijn de ruïnes van Griekse tempels wit en sober. Hoe zagen ze er <b>oorspronkelijk</b> uit?', opts:['Ze waren altijd wit, net zoals nu.','Ze waren helemaal van goud.','Ze waren fraai beschilderd in felle kleuren.','Ze waren zwart van het roet.'], ok:2, hint:'Je hebt net zelf geschilderd...', uitleg:'De tempels waren oorspronkelijk fraai beschilderd in felle kleuren, met beschilderde beelden van goden en mythes.'},
  a_bron:{type:'mc', src:'parthenon', label:'Bron: het Parthenon', page:'Herhaling 1, p. 6', q:'Zo ziet het Parthenon er vandaag uit. Wat voor bron is het <b>Parthenon zelf</b>?', opts:['een geschreven bron','een secundair werk','een monumentale bron: groot, blijvend en gemaakt om te eren en macht te tonen','een mondelinge bron'], ok:2, hint:'Groot, blijvend en gemaakt om een godin te eren en de macht van Athene te tonen.', uitleg:'Een monumentale bron is groot en blijvend en gemaakt om te herinneren, te eren of macht te tonen, bijvoorbeeld een tempel of standbeeld.'},
  a_sort:{type:'sort', label:'Evolutie van de beeldhouwkunst', page:'Les 3 deel 4, p. 27-28', q:'Zet de beelden in de juiste volgorde: van het <b>oudste</b> (boven) naar het <b>jongste</b> (onder).', items:['Stijf en recht, armen tegen het lichaam, één voet vooruit. Gemaakt naar Egyptisch model.','Een perfect, geïdealiseerd lichaam in rust. Het gewicht rust op één been.','Gezichten vol pijn en emotie. Lichamen die draaien en vechten tegen slangen.'], hint:'Eerst statisch en onnatuurlijk, dan de perfecte mens (idealisme), daarna echt en vol emotie (realisme).', uitleg:'Eerst statische, onnatuurlijke beelden naar Egyptisch model. In de 5de eeuw v.C. geïdealiseerde beelden van de perfecte mens. Daarna meer realisme, beweging en emotie.'},
  a_cont:{type:'mc', label:'Continuïteit in de beeldhouwkunst', page:'Les 3 deel 4, p. 27-28', q:'Wat bleef <b>hetzelfde</b> (continuïteit) bij al die mannenbeelden?', opts:['Ze droegen altijd een harnas.','Mannen werden gespierd en naakt afgebeeld.','Ze toonden altijd veel emotie.','Ze waren altijd van brons.'], ok:1, hint:'Kijk naar de drie beelden samen.', uitleg:'Mannen werden steeds gespierd en naakt afgebeeld: dat is continuïteit. De houding en de uitdrukking evolueerden: dat is verandering.'},
  a_real:{type:'mc', label:'Idealisme, realisme, statisch, dynamisch', page:'Les 3 deel 4, p. 27-28', q:'De Laocoöngroep toont pijn, angst en veel beweging. Welke twee begrippen passen daarbij?', opts:['idealisme en statisch','realisme en statisch','idealisme en dynamisch','realisme en dynamisch'], ok:3, hint:'Ziet het eruit als de echte werkelijkheid? En beweegt het?', uitleg:'Realisme: het ziet eruit als de werkelijkheid, met echte emoties. Dynamisch: het beeld vertoont veel beweging. De kouros is statisch, de speerdrager idealisme.'},
  a_filter:{type:'mc', v:true, label:'V+ Schoonheidsidealen vandaag', page:'Les 3 deel 4, p. 27-28', q:'Een influencer zet een filter op een foto die de huid perfect glad en de spieren groter maakt. Is dat eerder <b>idealisme</b> of <b>realisme</b>?', opts:['realisme: het toont de werkelijkheid','idealisme: het toont een perfect beeld, mooier dan de werkelijkheid','geen van beide','dynamisch'], ok:1, hint:'Is dat beeld echt, of beter dan echt?', uitleg:'Een filter maakt iemand mooier dan in werkelijkheid: idealisme, net zoals de beelden uit de 5de eeuw v.C. Kritisch kijken naar beelden blijft belangrijk!'}
};

  vaas:{ nr:'B4', titel:'Theseus en de Minotaurus', svg:itemCard('vaas', '#2a1d16'), cap:'B4: tekening in de stijl van een zwartfigurige Griekse vaas: Theseus verslaat de Minotaurus, naar voorbeelden uit de 6de eeuw v.C.' },

  gamebox:{ nr:'B6', titel:'De game Legends of Hellas', svg:itemCard('game', '#5c2f8a'), cap:'B6: tekening van de doos van de verzonnen game Legends of Hellas, 2024' },
  theater:{ nr:'B7', titel:'Het theater van Epidauros', urls:[WM('Epidaurus_Theater.jpg'), WM('Theatre_of_Epidaurus.jpg')], svg:() => canvasCard('#f2c79a', g => DRAW.theatre(g, { x:200, y:170, r:170 })), cap:'B7: foto van het theater van Epidauros (vandaag), gebouwd op het einde van de 4de eeuw v.C.', capSvg:'B7: tekening van het theater van Epidauros, gebouwd op het einde van de 4de eeuw v.C.' },
  kouros:{ nr:'B8', titel:'De Kroisos-kouros', urls:[WM('Kroisos_Kouros_NAMA_3851_Athens_Greece.jpg'), WM('Kouros_Kroisos_NAMA_3851.jpg'), WM('NAMA_Kroisos_Kouros.jpg')], svg:() => statueSVG('kouros'), cap:'B8: foto van de Kroisos-kouros, marmeren beeld, ca. 530 v.C. (Nationaal Archeologisch Museum, Athene)', capSvg:'B8: tekening van de Kroisos-kouros, marmeren beeld, ca. 530 v.C.' },

  start(){ if (Z.variant !== 'painted') setTemple('painted'); const order = ['lao','kouros','dory']; G.statues = Z.atelier.map((p, i) => ({ k: order[i], x: p.x, y: p.y + 6, h: 62 }));
    const b = spawn('beeldhouwer', { x: Z.pts.atelier.x, y: Z.pts.atelier.y + 70 }, { kind:'npc', name:'Beeldhouwer' }); G.marker = b;
    b.talk = () => say([['beeldhouwer','Mijn leerling heeft mijn verzameling door elkaar gezet. Jij lijkt slim. Weet jij hoe onze beeldhouwkunst veranderd is door de eeuwen heen?']], () => ask(['a_sort','a_cont','a_real'], () => say([{ q:'Nog een zijpad van Glaux:', choices:[ { t:'V+ zijpad: schoonheidsidealen vandaag', v:true, f:c => ask('a_filter', c) }, { t:'Nee, verder', f:c => c() } ] }, ['glaux',`Je reis zit erop, {naam}. Je hebt <b>${st.dr} drachmen</b> verdiend. Ga naar de <b>kunsthandel</b> en koop één kunstwerk voor je eigen museum!`]], nextStep))); } },
{ id:'a_kopen', act:4, obj:'Kies en koop één kunstwerk in de kunsthandel', fight:false,
  start(){ if (Z.variant !== 'painted') setTemple('painted'); G.statues = Z.shop.map((p, i) => ({ k: WERKEN[i].k, x: p.x, y: p.y + 6, h: 64 })); G.marker = Z.pts.handel;
    spawn('handelaar', { x: Z.pts.handel.x, y: Z.pts.handel.y + 70 }, { kind:'npc', name:'Kunsthandelaar' }).talk = () => say([['pheidias','Welkom! Bekijk rustig mijn beelden. Elk beeld heeft zijn prijs. Kies goed: je mag er maar één meenemen.']]);
    const min = Math.min(...WERKEN.map(w => w.prijs)); if (st.dr < min && !st.flags.bijlegging){ const tekort = min - st.dr; st.flags.bijlegging = tekort; addDr(tekort); say([['glaux', `Je komt ${tekort} drachmen tekort voor het goedkoopste beeld. Ik leg ze bij, maar herhaal zeker de onderdelen die nog moeilijk waren!`]]); }
    G.spots = Z.shop.map((p, i) => ({ x: p.x, y: p.y + 30, r: 38, label: `Bekijk: ${WERKEN[i].naam} (${WERKEN[i].prijs} drachmen)`, noGlint:true, use(){ shopCard(i); } }));
    objective('Kies en koop één kunstwerk in de kunsthandel', `Je hebt <b>${st.dr}</b> drachmen`);
  } }
];

function setTemple(v){ const o = Z.objs.find(o => o.type === 'temple'); if (o){ o.v = v; Z.variant = v; prerender(Z); } }

/* ---------- de kunsthandel ---------- */
function shopCard(i){
  const w = WERKEN[i], can = st.dr >= w.prijs; G.prevMode = G.mode; G.mode = 'ui';
  const box = $('#quiz'), card = box.querySelector('.qcard');
  card.innerHTML = `<div class="qhead"><span class="sp sp-b">Kunsthandel</span><span class="qpage">${ICO.coin} ${w.prijs} drachmen</span></div>${srcFig(w.k)}<div class="qq">${w.naam}</div><p>${w.txt}</p><p class="small">Jij hebt <b>${st.dr}</b> drachmen.</p>
    <div class="qrow"><button class="btn" id="koop" ${can ? '' : 'disabled style="opacity:.5;cursor:default"'}>${can ? `Koop voor ${w.prijs} drachmen` : `Te duur: je hebt nog ${w.prijs - st.dr} drachmen tekort`}</button><button class="btn alt" id="terug">Verder kijken</button></div>`;
  box.classList.add('open');
  $('#terug').onclick = () => { box.classList.remove('open'); G.mode = 'play'; };
  if (can) $('#koop').onclick = () => { box.classList.remove('open'); G.mode = 'play';
    say([{ q: `Ben je zeker? Je koopt <b>${w.naam}</b> voor ${w.prijs} drachmen.`, choices:[ { t:'Ja, ik koop dit kunstwerk!', f:c => { buy(i); } }, { t:'Nee, ik kijk nog even rond', f:c => c() } ] }]); };
}
function buy(i){
  const w = WERKEN[i]; st.flags.koop = w.k; addDr(-w.prijs); addSrc(w.k); SFX.quest(); confetti(); save();
  Q.a_stijl = { type:'mc', label:'De stijl van mijn kunstwerk herkennen', page:'Les 3 deel 4, p. 27-28', q:`Je kocht <b>${w.naam}</b>. In welke stijl werd het gemaakt?`, opts: STIJLEN.slice(), ok: w.stijl, hint:'Kijk naar de houding en het gezicht: stijf, perfect of vol emotie?', uitleg: `${w.naam}: ${STIJLEN[w.stijl]}.` };
  say([['pheidias', `Een uitstekende keuze! ${w.naam} is van jou.`]], () => ask('a_stijl', () => say([['glaux','Nog één ding voor we teruggaan naar het museum: schrijf op wat je geleerd hebt, dan geef ik het mee aan je leerkracht.']], () =>
    openQ('open1', 'Leg in je eigen woorden uit hoe de <b>natuurlijke omstandigheden</b> (landschap, klimaat, grondstoffen) het leven in een Griekse polis bepaalden. Gebruik minstens twee begrippen uit je leerwerkboek (p. 13-16).', () =>
    openQ('open2', `Waarom koos jij <b>${w.naam}</b>? Beschrijf het kunstwerk met minstens twee kenmerken van zijn stijl.`, endGame)))));
}

document.getElementById('drico').innerHTML = ICO.coin;
</script>
</body>
</html>
